<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum HTML 3</title>
</head>
<body>
    <!-- Penggunaan <div> untuk Tata Letak -->
    <div style="background-color: lightblue; padding: 20px;">
        <h2>Div Utama</h2>
        <p>Ini adalah konten dalam div utama.</p>
        <div style="background-color: lightgreen; padding: 10px;">
            <p>Ini adalah div di dalam div utama.</p>
        </div>
    </div>

    <!-- Penggunaan <span> untuk Gaya Teks -->
    <p>Teks ini mengandung elemen <span style="font-weight: bold;">span</span> yang diberi gaya teks tebal.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktikum 8 - Dashboard Admin Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="grid grid-cols-[220px_1fr] grid-rows-[80px_1fr_60px] min-h-screen gap-1">
        <header class="col-span-2 bg-blue-700 text-white flex items-center px-6 text-xl font-bold shadow-md z-10">
            Dashboard Admin Tailwind
        </header>
        <aside class="bg-slate-800 text-slate-300 p-6 flex flex-col gap-4">
            <a href="#" class="hover:text-white hover:bg-slate-700 p-2 rounded transition-colors">Beranda</a>
            <a href="#" class="hover:text-white hover:bg-slate-700 p-2 rounded transition-colors">Statistik</a>
            <a href="#" class="hover:text-white hover:bg-slate-700 p-2 rounded transition-colors">Pengaturan</a>
        </aside>
        <main class="bg-slate-50 p-6">
            <h2 class="text-2xl font-bold text-gray-700 mb-6">Ringkasan Sistem</h2>
            <div class="grid grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-gray-500 font-medium">Total Pengguna</span>
                        <span class="text-3xl font-bold text-gray-800">1,250</span>
                    </div>
                    <div class="bg-blue-100 p-3 rounded-full text-blue-600 font-bold">USR</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-green-500 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-gray-500 font-medium">Total Pendapatan</span>
                        <span class="text-3xl font-bold text-gray-800">Rp 45M</span>
                    </div>
                    <div class="bg-green-100 p-3 rounded-full text-green-600 font-bold">IDR</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-purple-500 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-gray-500 font-medium">Trafik Server</span>
                        <span class="text-3xl font-bold text-gray-800">85%</span>
                    </div>
                    <div class="bg-purple-100 p-3 rounded-full text-purple-600 font-bold">TRF</div>
                </div>
                <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-orange-500 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-gray-500 font-medium">Laporan Aktif</span>
                        <span class="text-3xl font-bold text-gray-800">12</span>
                    </div>
                    <div class="bg-orange-100 p-3 rounded-full text-orange-600 font-bold">RPT</div>
                </div>

            </div>
        </main>
        <footer class="col-span-2 bg-slate-200 text-gray-600 flex items-center justify-center px-6 text-sm">
            &copy; 2026 Admin Dashboard.
        </footer>
        
    </div>
</body>
</html>
